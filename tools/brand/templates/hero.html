<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body { width: 1760px; height: 860px; }
.card {
	position: absolute; inset: 0; border-radius: 56px; overflow: hidden;
	background:
		radial-gradient(900px 520px at 18% 110%, rgba(52, 199, 89, 0.30), transparent 70%),
		radial-gradient(900px 560px at 85% -10%, rgba(10, 132, 255, 0.24), transparent 70%),
		radial-gradient(700px 400px at 70% 120%, rgba(48, 209, 88, 0.18), transparent 70%),
		var(--bg);
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	text-align: center;
}
.dark .card {
	background:
		radial-gradient(900px 520px at 18% 110%, rgba(48, 209, 88, 0.30), transparent 70%),
		radial-gradient(900px 560px at 85% -10%, rgba(10, 132, 255, 0.30), transparent 70%),
		radial-gradient(700px 400px at 70% 120%, rgba(48, 209, 88, 0.16), transparent 70%),
		#000;
}
.icon { width: 236px; height: 236px; filter: drop-shadow(0 24px 40px rgba(0, 60, 30, 0.28)); margin-bottom: 44px; }
.dark .icon { filter: drop-shadow(0 24px 60px rgba(48, 209, 88, 0.25)); }
h1 { font-size: 132px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
h1 span { font-weight: 300; color: var(--ink-2); }
.tag { margin-top: 30px; font-size: 54px; font-weight: 600; letter-spacing: -0.02em;
	background: linear-gradient(90deg, #30B94D, #0A84FF); -webkit-background-clip: text; color: transparent; }
.sub { margin-top: 22px; font-size: 32px; font-weight: 400; color: var(--ink-2); letter-spacing: -0.005em; }
</style></head>
<body><script>if (location.search.includes('dark')) document.documentElement.className = 'dark';</script>
<div class="card">
	<img class="icon" src="../../../docs/brand/app-icon.svg">
	<h1>OpenLinks<span>2003</span></h1>
	<div class="tag">The classic golf game, rebuilt.</div>
	<div class="sub">Open source. Real Links physics. On Mac, Windows, Linux and the web.</div>
</div>
</body></html>
