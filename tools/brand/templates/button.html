<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body { width: 340px; height: 84px; }
.b { position: absolute; inset: 6px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
	font-size: 28px; font-weight: 500; letter-spacing: -0.01em; gap: 10px; }
.primary { background: linear-gradient(180deg, #2A8CFF, #0071E3); color: #fff;
	box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.45), 0 6px 16px rgba(0, 113, 227, 0.35); }
.secondary { color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
svg { width: 26px; height: 26px; }
</style></head>
<body>
<div class="b" id="b"></div>
<script>
const q = new URLSearchParams(location.search);
if (q.has('dark')) document.documentElement.className = 'dark';
const kinds = {
	play: ['primary', 'Play in your browser', '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>'],
	download: ['secondary', 'Download', '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'],
};
const [cls, label, icon] = kinds[q.get('b')];
const b = document.getElementById('b'); b.className = 'b ' + cls; b.innerHTML = icon + '<span>' + label + '</span>';
</script>
</body></html>
