[preset.0]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="assets/golfer/*.olg, assets/courses/*.olc, free_assets/*.olsky"
exclude_filter="tests/*, web/tests/*"
export_path="export/linux/OpenLinks2003.x86_64"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/golfer/*.olg, assets/courses/*.olc, free_assets/*.olsky"
exclude_filter="tests/*, web/tests/*"
export_path="export/windows/OpenLinks2003.exe"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="assets/golfer/*.olg, assets/courses/*.olc, free_assets/*.olsky"
exclude_filter="tests/*, web/tests/*"
export_path="export/macos/OpenLinks2003.zip"

[preset.2.options]

binary_format/architecture="universal"
application/bundle_identifier="io.github.crspytopgn.openlinks2003"
application/short_version="0.1"
application/version="0.1"
codesign/codesign=1
notarization/notarization=0

[preset.3]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="web/*.js, assets/golfer/*.olg, assets/courses/*.olc, free_assets/*.olsky"
exclude_filter="tests/*, web/tests/*"
export_path="export/web/index.html"

[preset.3.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script>addEventListener('DOMContentLoaded',function(){var c=document.getElementById('canvas');if(!c)return;c.addEventListener('webglcontextlost',function(){if(document.getElementById('ol-lost'))return;var d=document.createElement('div');d.id='ol-lost';d.style.cssText='position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#132a1c;color:#fff;font:17px/1.5 sans-serif;text-align:center;z-index:99';var t=document.createElement('div');t.textContent='The browser ran short of memory and stopped drawing the game. Anything the game had saved, such as a course it finished building, is still there after a reload.';var b=document.createElement('button');b.textContent='Reload';b.style.cssText='font-size:17px;padding:8px 24px';b.onclick=function(){location.reload();};d.appendChild(t);d.appendChild(b);document.body.appendChild(d);});});</script>"
progressive_web_app/enabled=false
