[preset.0]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="assets/golfer/*.olg"
exclude_filter="tests/*, web/tests/*"
export_path="export/linux/OpenLinks2003.x86_64"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/golfer/*.olg"
exclude_filter="tests/*, web/tests/*"
export_path="export/windows/OpenLinks2003.exe"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="assets/golfer/*.olg"
exclude_filter="tests/*, web/tests/*"
export_path="export/macos/OpenLinks2003.zip"

[preset.2.options]

binary_format/architecture="universal"
application/bundle_identifier="io.github.crspytopgn.openlinks2003"
application/short_version="0.1"
application/version="0.1"
codesign/codesign=1
notarization/notarization=0

[preset.3]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="web/*.js, assets/golfer/*.olg"
exclude_filter="tests/*, web/tests/*"
export_path="export/web/index.html"

[preset.3.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
