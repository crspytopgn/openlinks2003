name: tmp fetch photo golfer footage
on:
  push:
    branches: [claude/project-thread-l0lydb]
    paths: [.github/workflows/tmp-fetch-footage.yml]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download CC footage from Wikimedia Commons
        run: |
          mkdir footage && cd footage
          UA="OpenLinks2003-CI/0.1 (https://github.com/crspytopgn/openlinks2003)"
          for u in \
            "9/9e/Suvichaya_Vinijchaitham_Golf_Swing_Slow_Mo_2026.webm" \
            "2/2e/Golf_swing_practice_-_Kanagawa_-_slow_motion_-_2023_June_13.webm" \
            "0/0e/Manpracticinggolfswing-slowmotion-2021-3-24.webm"; do
            curl -fsSL -A "$UA" -o "$(basename "$u")" "https://upload.wikimedia.org/wikipedia/commons/$u" || echo "failed $u"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: footage
          path: footage
          retention-days: 2
