# Deploys the online-play server (server/) to Cloudflare. Manual only, and
# it does nothing until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets are set (see server/README.md).
name: Deploy online server

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy online server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: node --test "server/test/*.test.js"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret yet: see server/README.md"
            exit 1
          fi
          cd server && npx --yes wrangler@4 deploy
