name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  core:
    name: Core library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  export:
    name: Godot export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          mv /tmp/templates/templates/* "$dest/"

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Export Linux, Windows, macOS and Web
        run: |
          cd game
          mkdir -p export/linux export/windows export/macos export/web
          ~/godot/godot --headless --export-release "Linux" export/linux/OpenLinks2003.x86_64
          ~/godot/godot --headless --export-release "Windows" export/windows/OpenLinks2003.exe
          ~/godot/godot --headless --export-release "macOS" export/macos/OpenLinks2003.zip
          ~/godot/godot --headless --export-release "Web" export/web/index.html
          ls -lR export
          test -s export/linux/OpenLinks2003.x86_64
          test -s export/windows/OpenLinks2003.exe
          test -s export/macos/OpenLinks2003.zip
          test -s export/web/index.html
          test -s export/web/index.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-linux
          path: game/export/linux
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-windows
          path: game/export/windows
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-macos
          path: game/export/macos
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-web
          path: game/export/web
      - name: Upload web build for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/export/web

  # Publishes the web build to https://<owner>.github.io/<repo>/.
  # Requires a public repo (Pages on private repos needs a paid plan) and
  # Settings > Pages > Source set to "GitHub Actions". Skipped while private.
  deploy-web:
    name: Deploy web build
    needs: export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
