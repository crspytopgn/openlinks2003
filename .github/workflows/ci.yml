name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  core:
    name: Core library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Browser file import tests
        if: runner.os == 'Linux'
        run: node game/web/tests/test_game_files.mjs
      - name: Online server tests
        if: runner.os == 'Linux'
        run: node --test "server/test/*.test.js"
      - name: Upload olcourse
        uses: actions/upload-artifact@v4
        with:
          name: olcourse-${{ matrix.os }}
          path: |
            build/tools/olcourse/olcourse
            build/tools/olcourse/Release/olcourse.exe
          if-no-files-found: ignore

  export:
    name: Godot export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          mv /tmp/templates/templates/* "$dest/"

      # Free CC0 textures and sky from Poly Haven (not in the repo). A failed
      # download leaves the build untextured rather than failing it.
      - name: Fetch free assets
        run: python3 tools/fetch_free_assets.py

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      # Script errors don't change Godot's exit code, so check the log too.
      - name: GDScript tests
        run: |
          ~/godot/godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" godot-tests.log; then exit 1; fi
          grep -q "GODOT TESTS PASSED" godot-tests.log

      # Headless runs never compile shaders, so render real frames with Mesa's
      # software drivers: Compatibility (what the web build uses) on llvmpipe
      # and Forward+ on lavapipe. Script and shader errors fail the step.
      - name: Render check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          for method in gl_compatibility forward_plus; do
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path game --rendering-method $method \
              -s res://tests/render_check.gd -- "$PWD/render-$method.png" 2>&1 | tee render-$method.log
            if grep -E "SHADER ERROR|SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" render-$method.log; then exit 1; fi
            grep -q "RENDER CHECK DONE" render-$method.log
          done

      # Run the workflow by hand to get the screenshots in the log as base64,
      # for tools that can read logs but not download artifacts.
      - name: Print screenshots
        if: github.event_name == 'workflow_dispatch'
        run: |
          for f in render-*.jpg; do
            echo "BEGIN-SCREENSHOT $f"
            base64 -w 2000 "$f"
            echo "END-SCREENSHOT $f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-check
          path: render-*.*

      - name: Export Linux, Windows, macOS and Web
        run: |
          cd game
          mkdir -p export/linux export/windows export/macos export/web
          ~/godot/godot --headless --export-release "Linux" export/linux/OpenLinks2003.x86_64
          ~/godot/godot --headless --export-release "Windows" export/windows/OpenLinks2003.exe
          ~/godot/godot --headless --export-release "macOS" export/macos/OpenLinks2003.zip
          ~/godot/godot --headless --export-release "Web" export/web/index.html
          ls -lR export
          test -s export/linux/OpenLinks2003.x86_64
          test -s export/windows/OpenLinks2003.exe
          test -s export/macos/OpenLinks2003.zip
          test -s export/web/index.html
          test -s export/web/index.wasm

      # Download size per build and the biggest files in each pack, on the
      # job summary; fails when a build goes over tools/size_budget.json.
      - name: Size budget
        run: python3 tools/size_report.py --export game/export --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-linux
          path: game/export/linux
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-windows
          path: game/export/windows
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-macos
          path: game/export/macos
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-web
          path: game/export/web
      - name: Upload web build for GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/export/web

  # Publishes the desktop builds from main as the rolling "latest" release,
  # so there's a plain download link (artifacts need a GitHub login and
  # expire). The builds contain no game data.
  release:
    name: Publish latest release
    needs: export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenLinks2003-*
          path: dist
      - name: Package
        run: |
          ls -lR dist
          mkdir out
          cp dist/OpenLinks2003-macos/OpenLinks2003.zip out/OpenLinks2003-macOS.zip
          (cd dist/OpenLinks2003-windows && zip -qr ../../out/OpenLinks2003-Windows.zip .)
          chmod +x dist/OpenLinks2003-linux/OpenLinks2003.x86_64
          tar -C dist/OpenLinks2003-linux -czf out/OpenLinks2003-Linux.tar.gz .
          ls -l out
      - name: Update the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: |
            Built from main. No game data is included; the game loads your own Links 2003 files.

            **macOS:** unzip, move OpenLinks2003.app to Applications, then right-click it and choose Open (the app is ad-hoc signed, not notarized). On macOS 15 or later, if it still won't open, go to System Settings > Privacy & Security and click Open Anyway.
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "Latest build (${GITHUB_SHA::7})" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease

  # Publishes the web build to https://<owner>.github.io/<repo>/.
  # Requires a public repo (Pages on private repos needs a paid plan) and
  # Settings > Pages > Source set to "GitHub Actions". Skipped while private.
  # Re-deploy without a code change via Actions > CI > Run workflow.
  deploy-web:
    name: Deploy web build
    needs: export
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
