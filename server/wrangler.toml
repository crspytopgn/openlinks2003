# Cloudflare Worker for online play. Not deployed yet: see server/README.md.
name = "openlinks2003"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[durable_objects.bindings]]
name = "GAMES"
class_name = "GameObject"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject", "GameObject"]
